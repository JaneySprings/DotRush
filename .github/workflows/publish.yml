name: Publish VSIX
permissions:
  contents: write

on:
  push:
    tags:
      - '*'
    branches:
      - main

env:
  DOTNET_VERSION: '10.x'
  NODE_VERSION: '22'

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: VSMarketplace
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # dotnet-quality: preview

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Install Node tools
        run: npm install -g @vscode/vsce webpack-cli

      - name: Build VSIX
        run: |
          for arch in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            dotnet cake --target=vsix --configuration=release --arch=$arch
          done

      - name: Generate server archives
        run: dotnet cake --target=repack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG_NAME" HEAD)
          COMMITS=$(git log --pretty=format:"* %s (%h)" "$PREV_TAG..$TAG_NAME")
  
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$COMMITS" \
            --latest
          
          for file in artifacts/DotRush.Bundle.*; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              gh release upload "$TAG_NAME" "$file"
            fi
          done

      - name: Publish to VSMarketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for filename in artifacts/*.vsix; do
            vsce publish --packagePath "$filename" -p $VSCE_PAT
          done
